spring.datasource:
  driver-class-name: "org.postgresql.Driver"
  url: "${DB_URL}"
  username: "${DB_USERNAME}"
  password: "${DB_PASSWORD}"

spring.jpa:
  database-platform: org.hibernate.dialect.PostgreSQLDialect
  show-sql: false
  hibernate.ddl-auto: update
  properties:
    hibernate:
      jdbc:
        time_zone: Asia/Hong_Kong

server:
  port: ${PORT:8080} 