<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Admin</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ── Outer container (white card wrapping everything) ─────────────────── */
    .dash-wrap {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,.07);
      padding: 1.5rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ── Title bar ────────────────────────────────────────────────────────── */
    .dash-titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 1.1rem;
      border-bottom: 1px solid #f0f2f6;
    }
    .dash-titlebar__title {
      font-size: 1.3rem; font-weight: 800; letter-spacing: -.03em; color: #111827;
    }
    .dash-titlebar__right {
      display: flex; align-items: center; gap: .65rem;
    }
    .dash-refresh-label {
      font-size: .775rem; color: #9ca3af;
      display: flex; align-items: center; gap: .35rem;
    }
    .dash-sep { width: 1px; height: 18px; background: #e5e7eb; }
    .dash-icon-btn {
      width: 32px; height: 32px; border-radius: 7px;
      border: 1px solid #e5e7eb; background: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: #6b7280;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .dash-icon-btn:hover { background: #f3f4f6; border-color: #d1d5db; color: #374151; }

    /* ── KPI strip (single unified card with dividers) ────────────────────── */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }
    .kpi-cell {
      display: flex; align-items: center; gap: 1rem;
      padding: 1.1rem 1.4rem;
      border-right: 1px solid #e5e7eb;
      background: #fff;
    }
    .kpi-cell:last-child { border-right: none; }
    .kpi-cell__icon {
      width: 46px; height: 46px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .kpi-cell__icon--blue   { background: #eff6ff; color: #2563eb; }
    .kpi-cell__icon--green  { background: #f0fdf4; color: #16a34a; }
    .kpi-cell__icon--orange { background: #fff7ed; color: #ea580c; }
    .kpi-cell__icon--purple { background: #faf5ff; color: #7c3aed; }
    .kpi-cell__body { min-width: 0; }
    .kpi-cell__label {
      font-size: .72rem; color: #6b7280; font-weight: 500;
      margin-bottom: .25rem; white-space: nowrap;
    }
    .kpi-cell__value {
      font-size: 1.5rem; font-weight: 800;
      letter-spacing: -.04em; color: #111827; line-height: 1.05;
    }
    .kpi-cell__trend {
      display: inline-flex; align-items: center; gap: .2rem;
      font-size: .7rem; font-weight: 600; margin-top: .2rem;
    }
    .kpi-cell__trend--up   { color: #16a34a; }
    .kpi-cell__trend--down { color: #dc2626; }
    .kpi-cell__trend--flat { color: #9ca3af; }

    /* ── Charts row (50/50) ──────────────────────────────────────────────── */
    .dash-charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .status-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem;
    }
    .stat-card {
      background: #f8f9fb;
      border: 1px solid #eef0f3;
      border-radius: 10px;
      padding: .95rem 1rem;
    }
    .stat-card__icon {
      width: 34px; height: 34px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: .55rem;
    }
    .stat-card__icon--amber { background: #fef3c7; color: #d97706; }
    .stat-card__icon--blue  { background: #dbeafe; color: #2563eb; }
    .stat-card__icon--green { background: #dcfce7; color: #16a34a; }
    .stat-card__value {
      font-size: 1.5rem; font-weight: 800;
      letter-spacing: -.04em; color: #111827; line-height: 1;
    }
    .stat-card__label {
      font-size: .71rem; color: #6b7280;
      margin-top: .25rem; font-weight: 500;
    }

    /* ── Chart cards ──────────────────────────────────────────────────────── */
    .chart-card {
      background: #fff;
      border: 1px solid #eef0f3;
      border-radius: 10px;
      padding: 1.1rem 1.25rem;
    }
    .chart-card__hd {
      margin-bottom: .9rem;
    }
    .chart-card__title { font-size: .88rem; font-weight: 700; color: #111827; }
    .chart-card__sub   { font-size: .71rem; color: #9ca3af; margin-top: .1rem; }

    /* ── Recent orders ────────────────────────────────────────────────────── */
    .recent-wrap {
      border: 1px solid #eef0f3;
      border-radius: 10px;
      overflow: hidden;
    }
    .recent-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: .85rem 1.25rem;
      border-bottom: 1px solid #eef0f3;
      background: #fff;
    }
    .recent-head__title { font-size: .88rem; font-weight: 700; color: #111827; }

    .recent-table { width: 100%; border-collapse: collapse; }
    .recent-table th {
      text-align: left; font-size: .7rem; font-weight: 700;
      color: #9ca3af; padding: .55rem 1.1rem;
      background: #f8f9fb;
      text-transform: uppercase; letter-spacing: .05em;
      border-bottom: 1px solid #eef0f3;
    }
    .recent-table td {
      padding: .72rem 1.1rem; font-size: .845rem;
      border-bottom: 1px solid #f5f6f8;
      vertical-align: middle;
    }
    .recent-table tr:last-child td { border-bottom: none; }
    .recent-table tbody tr:hover td { background: #fafbfc; }

    .ord-id     { font-weight: 700; color: #111827; }
    .ord-items  { max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #9ca3af; font-size: .78rem; }
    .ord-amount { font-weight: 700; }
    .ord-time   { color: #9ca3af; font-size: .78rem; white-space: nowrap; }

    .ord-status {
      display: inline-flex; align-items: center;
      padding: .2rem .6rem;
      border-radius: 999px; font-size: .7rem; font-weight: 600;
    }
    .ord-status--ORDERED           { background:#dbeafe; color:#1d4ed8; }
    .ord-status--PREPARING         { background:#fef9c3; color:#92400e; }
    .ord-status--READY_FOR_PICK_UP { background:#d1fae5; color:#065f46; }
    .ord-status--PICKED_UP         { background:#e9d5ff; color:#6b21a8; }
    .ord-status--CANCELLED         { background:#fee2e2; color:#991b1b; }
    .ord-status--ABANDONED         { background:#f3f4f6; color:#6b7280; }
    .ord-status--REJECTED          { background:#fce7f3; color:#9d174d; }

    /* ── Responsive ───────────────────────────────────────────────────────── */
    @media (max-width: 1100px) {
      .kpi-strip { grid-template-columns: repeat(2, 1fr); }
      .kpi-cell:nth-child(2) { border-right: none; }
      .kpi-cell:nth-child(3) { border-top: 1px solid #e5e7eb; }
      .dash-charts { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .kpi-strip    { grid-template-columns: 1fr; }
      .kpi-cell     { border-right: none; border-bottom: 1px solid #e5e7eb; }
      .kpi-cell:last-child { border-bottom: none; }
      .status-panel { grid-template-columns: 1fr; }
      .dash-wrap    { padding: 1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar__brand" href="/admin/dashboard.html">Canteen Admin</a>
    <div class="navbar__actions">
      <span class="navbar__user" id="nav-user"></span>
      <button class="btn btn--secondary btn--sm" onclick="clearSession()">Logout</button>
    </div>
  </nav>

  <div class="admin-layout">
    <nav class="admin-sidebar">
      <div class="admin-sidebar__section">Management</div>
      <ul class="admin-sidebar__nav" id="admin-nav"></ul>
    </nav>

    <div class="admin-content">
      <div class="dash-wrap">

        <!-- Title bar -->
        <div class="dash-titlebar">
          <span class="dash-titlebar__title">Dashboard</span>
          <div class="dash-titlebar__right">
            <span class="dash-refresh-label" id="dash-refreshed">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              <span id="dash-date"></span>
            </span>
            <div class="dash-sep"></div>
            <button class="dash-icon-btn" onclick="load()" title="Refresh">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
              </svg>
            </button>
            <button class="dash-icon-btn" title="More options">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- KPI strip -->
        <div class="kpi-strip" id="kpi-strip">
          <div class="kpi-cell"><div class="spinner"></div></div>
          <div class="kpi-cell"><div class="spinner"></div></div>
          <div class="kpi-cell"><div class="spinner"></div></div>
          <div class="kpi-cell"><div class="spinner"></div></div>
        </div>

        <!-- Status row -->
        <div class="status-panel" id="status-panel">
          <div class="stat-card"><div class="spinner"></div></div>
          <div class="stat-card"><div class="spinner"></div></div>
          <div class="stat-card"><div class="spinner"></div></div>
        </div>

        <!-- Charts row: Daily Revenue + Daily Orders (50/50) -->
        <div class="dash-charts">
          <div class="chart-card">
            <div class="chart-card__hd">
              <div class="chart-card__title">Daily Revenue</div>
              <div class="chart-card__sub">Last 30 days</div>
            </div>
            <canvas id="revenue-chart" height="140"></canvas>
          </div>
          <div class="chart-card">
            <div class="chart-card__hd">
              <div class="chart-card__title">Daily Orders</div>
              <div class="chart-card__sub">Last 7 days</div>
            </div>
            <canvas id="orders-chart" height="140"></canvas>
          </div>
        </div>

        <!-- Recent orders -->
        <div class="recent-wrap">
          <div class="recent-head">
            <span class="recent-head__title">Recent Orders</span>
            <a href="/admin/orders.html" class="btn btn--ghost btn--sm">View All &rarr;</a>
          </div>
          <div id="recent-orders"><div class="spinner"></div></div>
        </div>

      </div><!-- /.dash-wrap -->
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const session = guardPage('ADMIN');
    document.getElementById('admin-nav').innerHTML = buildAdminSidebar('/admin/dashboard.html');
    document.getElementById('nav-user').textContent = session.schoolId;

    function updateRefreshTime() {
      document.getElementById('dash-date').textContent =
        'Data refreshed at ' + new Date().toLocaleString('en-MY', {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: '2-digit', minute: '2-digit',
        });
    }
    updateRefreshTime();

    const STATUS_LABEL = {
      ORDERED: 'Ordered', PREPARING: 'Preparing',
      READY_FOR_PICK_UP: 'Ready for Pick Up', PICKED_UP: 'Picked Up',
      CANCELLED: 'Cancelled', ABANDONED: 'Abandoned', REJECTED: 'Rejected',
    };

    /* ── SVG helpers ─────────────────────────────────────────────────────── */
    function svg(paths, size = 22) {
      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
    }
    const ICONS = {
      dollar:   svg('<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'),
      bag:      svg('<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>'),
      zap:      svg('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>'),
      trendUp:  svg('<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>'),
      clock:    svg('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', 18),
      flame:    svg('<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/>', 18),
      checkCircle: svg('<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>', 18),
      arrowUp:  `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`,
      arrowDn:  `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
      dash:     `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    };

    let revenueChart = null;
    let ordersChart  = null;

    /* ── Helpers ─────────────────────────────────────────────────────────── */
    function isToday(d)     { return d && new Date(d).toDateString() === new Date().toDateString(); }
    function isYesterday(d) {
      if (!d) return false;
      const y = new Date(); y.setDate(y.getDate() - 1);
      return new Date(d).toDateString() === y.toDateString();
    }
    function trend(cur, prev) {
      if (prev === 0) return { label: cur > 0 ? '+100%' : '—', dir: cur > 0 ? 'up' : 'flat' };
      const p = ((cur - prev) / prev * 100).toFixed(1);
      return { label: `${p > 0 ? '+' : ''}${p}%`, dir: p > 0 ? 'up' : p < 0 ? 'down' : 'flat' };
    }
    function trendBadge(t) {
      if (!t) return '';
      const icon = t.dir === 'up' ? ICONS.arrowUp : t.dir === 'down' ? ICONS.arrowDn : ICONS.dash;
      return `<div class="kpi-cell__trend kpi-cell__trend--${t.dir}">${icon} ${t.label} vs yesterday</div>`;
    }

    /* ── KPI strip ───────────────────────────────────────────────────────── */
    function renderKPI(orders) {
      const todayPaid = orders.filter(o => isToday(o.orderTime) && !['CANCELLED','REJECTED','ABANDONED'].includes(o.orderStatus));
      const yestPaid  = orders.filter(o => isYesterday(o.orderTime) && !['CANCELLED','REJECTED','ABANDONED'].includes(o.orderStatus));
      const todayRev  = todayPaid.reduce((s, o) => s + (Number(o.totalAmount) || 0), 0);
      const yestRev   = yestPaid.reduce((s, o)  => s + (Number(o.totalAmount) || 0), 0);
      const todayAvg  = todayPaid.length ? todayRev / todayPaid.length : 0;
      const yestAvg   = yestPaid.length  ? yestRev  / yestPaid.length  : 0;
      const active    = orders.filter(o => ['ORDERED','PREPARING','READY_FOR_PICK_UP'].includes(o.orderStatus)).length;

      const cells = [
        { icon: ICONS.dollar,  cls: 'blue',   value: formatCurrency(todayRev),    label: "Today's Revenue",  t: trend(todayRev, yestRev) },
        { icon: ICONS.bag,     cls: 'green',  value: todayPaid.length,             label: "Today's Orders",   t: trend(todayPaid.length, yestPaid.length) },
        { icon: ICONS.zap,     cls: 'orange', value: active,                       label: 'Active Orders',    t: null },
        { icon: ICONS.trendUp, cls: 'purple', value: formatCurrency(todayAvg),     label: 'Avg Order Value',  t: trend(todayAvg, yestAvg) },
      ];

      document.getElementById('kpi-strip').innerHTML = cells.map(c => `
        <div class="kpi-cell">
          <div class="kpi-cell__icon kpi-cell__icon--${c.cls}">${c.icon}</div>
          <div class="kpi-cell__body">
            <div class="kpi-cell__label">${c.label}</div>
            <div class="kpi-cell__value">${c.value}</div>
            ${trendBadge(c.t)}
          </div>
        </div>`).join('');
    }

    /* ── Status panel (3 stat cards) ─────────────────────────────────────── */
    function renderStatus(orders) {
      const pending   = orders.filter(o => o.orderStatus === 'ORDERED').length;
      const preparing = orders.filter(o => o.orderStatus === 'PREPARING').length;
      const ready     = orders.filter(o => o.orderStatus === 'READY_FOR_PICK_UP').length;
      const stats = [
        { icon: ICONS.clock,       cls: 'amber', value: pending,   label: 'Pending Orders' },
        { icon: ICONS.flame,       cls: 'blue',  value: preparing, label: 'Preparing' },
        { icon: ICONS.checkCircle, cls: 'green', value: ready,     label: 'Ready for Pick Up' },
      ];
      document.getElementById('status-panel').innerHTML = stats.map(s => `
        <div class="stat-card">
          <div class="stat-card__icon stat-card__icon--${s.cls}">${s.icon}</div>
          <div class="stat-card__value">${s.value}</div>
          <div class="stat-card__label">${s.label}</div>
        </div>`).join('');
    }

    /* ── Revenue line chart ───────────────────────────────────────────────── */
    function renderRevenueChart(orders) {
      const ctx    = document.getElementById('revenue-chart').getContext('2d');
      const labels = [];
      const data   = [];
      const now    = new Date();
      for (let i = 29; i >= 0; i--) {
        const day = new Date(now);
        day.setDate(now.getDate() - i);
        day.setHours(0, 0, 0, 0);
        labels.push(day.toLocaleDateString('en-MY', { month: 'short', day: 'numeric' }));
        data.push(orders
          .filter(o => o.orderTime && new Date(o.orderTime).toDateString() === day.toDateString()
            && !['CANCELLED','REJECTED','ABANDONED'].includes(o.orderStatus))
          .reduce((s, o) => s + (Number(o.totalAmount) || 0), 0));
      }
      if (revenueChart) revenueChart.destroy();
      revenueChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Revenue',
            data,
            fill: true,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37,99,235,.07)',
            borderWidth: 2,
            pointRadius: 2,
            pointBackgroundColor: '#2563eb',
            pointHoverRadius: 5,
            tension: 0.4,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#9ca3af', maxTicksLimit: 8 } },
            y: { beginAtZero: true, grid: { color: '#f3f4f6' },
                 ticks: { font: { size: 10 }, color: '#9ca3af', callback: v => 'HKD ' + v } },
          },
        },
      });
    }

    /* ── Daily orders bar chart (last 7 days) ─────────────────────────────── */
    function renderDailyOrdersChart(orders) {
      const ctx    = document.getElementById('orders-chart').getContext('2d');
      const labels = [];
      const data   = [];
      const now    = new Date();
      for (let i = 6; i >= 0; i--) {
        const day = new Date(now);
        day.setDate(now.getDate() - i);
        day.setHours(0, 0, 0, 0);
        labels.push(day.toLocaleDateString('en-MY', { weekday: 'short', month: 'short', day: 'numeric' }));
        data.push(orders.filter(o => o.orderTime && new Date(o.orderTime).toDateString() === day.toDateString()).length);
      }
      if (ordersChart) ordersChart.destroy();
      ordersChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Orders',
            data,
            backgroundColor: data.map((_, i) => i === data.length - 1 ? '#6366f1' : 'rgba(99,102,241,.45)'),
            borderRadius: 5,
            borderSkipped: false,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#9ca3af' } },
            y: { beginAtZero: true, grid: { color: '#f3f4f6' },
                 ticks: { font: { size: 10 }, color: '#9ca3af', precision: 0 } },
          },
        },
      });
    }

    /* ── Recent orders table ─────────────────────────────────────────────── */
    function renderRecentOrders(orders) {
      const recent = orders.slice().sort((a, b) => new Date(b.orderTime) - new Date(a.orderTime)).slice(0, 8);
      if (!recent.length) {
        document.getElementById('recent-orders').innerHTML =
          '<p class="text-muted text-sm" style="padding:.75rem 1.1rem">No orders yet.</p>';
        return;
      }
      document.getElementById('recent-orders').innerHTML = `
        <div class="table-wrap">
          <table class="recent-table">
            <thead>
              <tr><th>Order</th><th>Customer</th><th>Items</th><th>Amount</th><th>Status</th><th>Time</th></tr>
            </thead>
            <tbody>
              ${recent.map(o => {
                const items = (o.orderedItems || []).map(i => `${i.name} \xd7${i.quantity}`).join(', ');
                const time  = o.orderTime
                  ? new Date(o.orderTime).toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' })
                  : '—';
                return `<tr>
                  <td><span class="ord-id">#${o.orderId}</span></td>
                  <td>${o.customerName || '—'}</td>
                  <td><span class="ord-items" title="${items}">${items || '—'}</span></td>
                  <td><span class="ord-amount">${formatCurrency(o.totalAmount)}</span></td>
                  <td><span class="ord-status ord-status--${o.orderStatus}">${STATUS_LABEL[o.orderStatus] || o.orderStatus}</span></td>
                  <td><span class="ord-time">${time}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;
    }

    /* ── Load ────────────────────────────────────────────────────────────── */
    async function load() {
      try {
        const orders = await api.getAllOrders();
        renderKPI(orders);
        renderStatus(orders);
        renderRevenueChart(orders);
        renderDailyOrdersChart(orders);
        renderRecentOrders(orders);
        updateRefreshTime();
      } catch (err) {
        document.getElementById('kpi-strip').innerHTML =
          `<div class="kpi-cell" style="grid-column:1/-1;justify-content:center;padding:2rem">
             <span class="text-muted">${err.message}</span>
           </div>`;
      }
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
