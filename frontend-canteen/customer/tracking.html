<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Order — Canteen System</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>
<body>
  <nav class="navbar">
    <a class="navbar__brand" href="/customer/menu.html">Campus Canteen</a>
    <ul class="navbar__nav">
      <li><a href="/customer/menu.html">Menu</a></li>
      <li><a href="/customer/history.html" class="active">My Orders</a></li>
      <li><a href="/customer/wallet.html">Wallet</a></li>
      <li><a href="/customer/profile.html">Profile</a></li>
    </ul>
    <div class="navbar__actions">
      <span class="navbar__user" id="nav-user"></span>
      <button class="btn btn--secondary btn--sm" onclick="clearSession()">Logout</button>
    </div>
  </nav>

  <main class="page" style="max-width:600px">
    <div class="page-header">
      <h1 class="page-title" style="margin:0">Order Tracking</h1>
      <a href="/customer/history.html" class="btn btn--secondary btn--sm">← All Orders</a>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </main>

  <nav class="bottom-nav">
    <a href="/customer/menu.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg></span><span>Menu</span>
    </a>
    <a href="/customer/history.html" class="bottom-nav__item active">
      <span class="bottom-nav__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg></span><span>Orders</span>
    </a>
    <a href="/customer/wallet.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><circle cx="17" cy="13" r="1.25" fill="currentColor" stroke="none"/></svg></span><span>Wallet</span>
    </a>
    <a href="/customer/profile.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span><span>Profile</span>
    </a>
  </nav>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const session = guardPage('CUSTOMER');
    document.getElementById('nav-user').textContent = session.schoolId;

    const orderId = getParam('orderId');
    if (!orderId) { location.replace('history.html'); }

    const STEPS = [
      { key: 'ORDERED',           label: 'Order Received',    desc: 'Your order has been placed' },
      { key: 'PREPARING',         label: 'Preparing',         desc: 'The kitchen is preparing your food' },
      { key: 'READY_FOR_PICK_UP', label: 'Ready for Pick-up', desc: 'Your order is ready at the counter' },
      { key: 'PICKED_UP',         label: 'Picked Up',         desc: 'Order complete — enjoy your meal!' },
    ];

    const TERMINAL = new Set(['PICKED_UP', 'CANCELLED', 'REJECTED', 'ABANDONED']);
    let pollTimer = null;

    function render(data) {
      const logs      = data.orderTrackingStatus || [];
      const statusMap = {};
      logs.forEach(s => { statusMap[s.status] = s.timestamp; });

      const latestStatus = logs.length ? logs[logs.length - 1].status : 'ORDERED';
      const isTerminal   = TERMINAL.has(latestStatus);
      const isCancelled  = latestStatus === 'CANCELLED' || latestStatus === 'REJECTED' || latestStatus === 'ABANDONED';

      const timelineHTML = STEPS.map((step, i) => {
        const ts      = statusMap[step.key];
        const isDone  = ts !== undefined;
        const isCurr  = step.key === latestStatus && !isTerminal;
        let cls = 'track-step';
        if (isDone)  cls += ' track-step--done';
        if (isCurr)  cls += ' track-step--current';
        return `
          <div class="${cls}">
            <div class="track-step__dot"></div>
            ${i < STEPS.length - 1 ? '<div class="track-step__line"></div>' : ''}
            <div class="track-step__body">
              <div class="track-step__label">${step.label}</div>
              ${ts
                ? `<div class="track-step__time">${formatDate(ts)}</div>`
                : `<div class="track-step__desc">${step.desc}</div>`}
            </div>
          </div>`;
      }).join('');

      const itemsHTML = (data.orderedItems || []).map(i =>
        `<div class="track-item">
          <span class="track-item__name">${i.name}</span>
          <span class="track-item__qty">× ${i.quantity}</span>
        </div>`).join('');

      const cancelBtn = (latestStatus === 'ORDERED')
        ? `<button class="btn btn--danger btn--sm" id="cancel-btn" onclick="cancelOrder()">Cancel Order</button>`
        : '';

      const footerAction = isTerminal
        ? `<a href="menu.html" class="btn btn--primary btn--sm">Order Again</a>`
        : `<span class="track-refresh-note">Auto-refreshing every 10 s…</span>`;

      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="track-header">
            <div>
              <div class="track-order-id">Order #${data.orderId}</div>
              ${isCancelled
                ? `<div class="track-status-label track-status-label--cancelled">${STATUS_LABELS[latestStatus] || latestStatus}</div>`
                : `<div class="track-status-label">${STATUS_LABELS[latestStatus] || latestStatus}</div>`}
            </div>
            ${cancelBtn}
          </div>

          <div class="track-section-title">Items</div>
          <div class="track-items">${itemsHTML}</div>

          ${data.remark ? `
          <div class="track-section-title" style="margin-top:1.25rem">Remarks</div>
          <div style="font-size:.875rem;color:var(--color-text-muted);padding:.35rem 0">${data.remark}</div>
          ` : ''}

          <div class="track-section-title" style="margin-top:1.25rem">Order Progress</div>
          ${isCancelled
            ? `<div class="track-cancelled-note">${STATUS_LABELS[latestStatus] || latestStatus} — ${logs.length ? formatDate(logs[logs.length-1].timestamp) : ''}</div>`
            : `<div class="track-timeline">${timelineHTML}</div>`}

          <div class="track-footer">${footerAction}</div>
        </div>`;
    }

    async function load() {
      try {
        const data = await api.trackOrder(orderId);
        render(data);
        const logs = data.orderTrackingStatus || [];
        const latestStatus = logs.length ? logs[logs.length - 1].status : 'ORDERED';
        if (TERMINAL.has(latestStatus)) clearInterval(pollTimer);
      } catch (err) {
        document.getElementById('content').innerHTML =
          `<div class="empty-state">
            <div class="empty-state__icon">⚠️</div>
            <div class="empty-state__title">${err.message || 'Failed to load order'}</div>
            <a href="history.html" class="btn btn--secondary btn--sm mt-2">Back to Orders</a>
          </div>`;
        clearInterval(pollTimer);
      }
    }

    async function cancelOrder() {
      const btn = document.getElementById('cancel-btn');
      if (!btn) return;
      setLoading(btn, true);
      try {
        const res = await api.cancelOrder(session.id, orderId);
        showToast(res.message || 'Order cancelled', 'success');
        load();
      } catch (err) {
        showToast(err.message || 'Cannot cancel order', 'error');
        setLoading(btn, false);
      }
    }

    load();
    pollTimer = setInterval(load, 10000);
  </script>
</body>
</html>
