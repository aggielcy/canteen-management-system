<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallet — Canteen System</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>
<body>
  <nav class="navbar">
    <a class="navbar__brand" href="/customer/menu.html">Campus Canteen</a>
    <ul class="navbar__nav">
      <li><a href="/customer/menu.html">Menu</a></li>
      <li><a href="/customer/history.html">My Orders</a></li>
      <li><a href="/customer/wallet.html" class="active">Wallet</a></li>
      <li><a href="/customer/profile.html">Profile</a></li>
    </ul>
    <div class="navbar__actions">
      <span class="navbar__user" id="nav-user"></span>
      <button class="btn btn--secondary btn--sm" onclick="clearSession()">Logout</button>
    </div>
  </nav>

  <main class="page" style="max-width:500px">
    <h1 class="page-title">Wallet</h1>

    <div id="wallet-card">
      <div class="spinner"></div>
    </div>

    <div class="card" style="margin-top:1.5rem">
      <h2 style="font-size:.95rem;font-weight:600;margin-bottom:.75rem">Top Up Wallet</h2>
      <form id="topup-form">
        <div class="form-group">
          <label for="tu-amount">Amount (HKD)</label>
          <div class="topup-presets">
            <button type="button" class="topup-preset-btn" onclick="setTopupAmount(50)">HKD 50</button>
            <button type="button" class="topup-preset-btn" onclick="setTopupAmount(100)">HKD 100</button>
            <button type="button" class="topup-preset-btn" onclick="setTopupAmount(200)">HKD 200</button>
          </div>
          <input type="number" id="tu-amount" min="1" step="1" placeholder="or enter amount…" required
            oninput="if(this.value)this.value=Math.max(1,Math.floor(this.value))||''; document.querySelectorAll('.topup-preset-btn').forEach(b=>b.classList.remove('topup-preset-btn--active'))">
        </div>
        <div class="form-group">
          <label for="tu-method">Payment Method</label>
          <select id="tu-method">
            <option value="CREDIT_CARD">Credit Card</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tu-ref">Reference ID (optional)</label>
          <input type="text" id="tu-ref" placeholder="e.g. receipt number">
        </div>
        <button type="submit" class="btn btn--primary" id="topup-btn">+ Top Up</button>
      </form>
    </div>

    <h2 class="page-title" style="margin-top:2rem;font-size:1.1rem">Transaction History</h2>
    <div id="trx-list">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Bottom navigation (mobile) -->
  <nav class="bottom-nav">
    <a href="/customer/menu.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg></span>
      <span>Menu</span>
    </a>
    <a href="/customer/history.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg></span>
      <span>Orders</span>
    </a>
    <a href="/customer/wallet.html" class="bottom-nav__item active">
      <span class="bottom-nav__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><circle cx="17" cy="13" r="1.25" fill="currentColor" stroke="none"/></svg></span>
      <span>Wallet</span>
    </a>
    <a href="/customer/profile.html" class="bottom-nav__item">
      <span class="bottom-nav__icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
      <span>Profile</span>
    </a>
  </nav>

  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    function setTopupAmount(val) {
      document.getElementById('tu-amount').value = val;
      document.querySelectorAll('.topup-preset-btn').forEach(b =>
        b.classList.toggle('topup-preset-btn--active', parseFloat(b.textContent.replace('HKD ', '')) === val)
      );
    }

    const session = guardPage('CUSTOMER');
    document.getElementById('nav-user').textContent = session.schoolId;

    async function loadWallet() {
      const container = document.getElementById('wallet-card');
      try {
        const w = await api.getWallet(session.id);
        container.innerHTML = `
          <div class="wallet-balance-card">
            <div class="wallet-balance-card__label">Available Balance</div>
            <div class="wallet-balance-card__amount">${formatCurrency(w.balance)}</div>
            <div class="wallet-balance-card__schoolId">${session.schoolId}</div>
          </div>`;
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state__icon">⚠️</div><div class="empty-state__title">${err.message}</div></div>`;
      }
    }

    async function loadTransactions() {
      const container = document.getElementById('trx-list');
      try {
        const txns = await api.getTransactionHistory(session.id);
        if (!txns || !txns.length) {
          container.innerHTML = '<div class="text-muted text-sm text-center" style="padding:1rem">No transactions yet</div>';
          return;
        }
        const TRX_LABEL = { TOP_UP: 'Top Up', PURCHASE: 'Purchase', REFUND: 'Refund' };
        const METHOD_LABEL = { CASH: 'Cash', CREDIT_CARD: 'Credit Card', WALLET: 'Wallet' };
        container.innerHTML = txns.map(t => {
          const isCredit = t.transactionType === 'TOP_UP' || t.transactionType === 'REFUND';
          const sign = isCredit ? '+' : '-';
          const amountClass = isCredit ? 'trx-amount--credit' : 'trx-amount--debit';
          const orderRef = t.orderId ? `<span class="text-muted text-sm"> · Order #${t.orderId}</span>` : '';
          return `
            <div class="trx-row">
              <div class="trx-row__left">
                <div class="trx-row__type">${TRX_LABEL[t.transactionType] || t.transactionType}${orderRef}</div>
                <div class="trx-row__meta text-muted text-sm">${METHOD_LABEL[t.paymentMethod] || t.paymentMethod} · ${formatDate(t.createdAt)}</div>
              </div>
              <div class="trx-amount ${amountClass}">${sign} ${formatCurrency(t.amount)}</div>
            </div>`;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><div class="empty-state__icon">⚠️</div><div class="empty-state__title">${err.message}</div></div>`;
      }
    }

    document.getElementById('topup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('topup-btn');
      const amount = parseFloat(document.getElementById('tu-amount').value);
      if (!amount || amount <= 0) { showToast('Enter a valid amount', 'error'); return; }
      setLoading(btn, true);
      try {
        await api.topUp({
          userId: session.id,
          amount,
          paymentMethod: document.getElementById('tu-method').value,
          referenceId: document.getElementById('tu-ref').value.trim() || null,
        });
        showToast(`Top-up of ${formatCurrency(amount)} successful`, 'success');
        document.getElementById('topup-form').reset();
        loadWallet();
        loadTransactions();
      } catch (err) {
        showToast(err.message || 'Top-up failed', 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    loadWallet();
    loadTransactions();
  </script>
</body>
</html>
